name: "Ship It!"

concurrency:
  # There should only be able one running job per repository / branch combo.
  # We do not want multiple deploys running in parallel.
  group: ${{ github.repository }}-${{ github.ref_name }}

on:
  push:
    branches:
      - 'master'
  pull_request:
  workflow_dispatch:

# Checkout needs read; gated GHCR publishing uses the short-lived workflow token.
# Fork pull requests receive a read-only token and cannot run Publish/Deploy.
# Reusable workflows cannot elevate permissions beyond those granted here.
permissions:
  contents: read
  packages: write

# Exactly one of the two jobs runs — the `if:` conditions are exact complements:
#   - Namespace.so runner when the RUNS_ON variable contains 'namespace'. This is
#     the preferred default on any repo with Namespace access — the canonical
#     repo or a fork that has it (e.g. gerhard/changelog.com).
#   - GitHub-hosted runner otherwise, i.e. when RUNS_ON is unset — the case for
#     forks without Namespace access.
jobs:
  namespace:
    if: ${{ contains(vars.RUNS_ON, 'namespace') }}
    uses: ./.github/workflows/namespace.yml
    # Pass only the one secret the reusable workflow uses, not inherit-all.
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  github:
    if: ${{ !contains(vars.RUNS_ON, 'namespace') }}
    uses: ./.github/workflows/github.yml
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
